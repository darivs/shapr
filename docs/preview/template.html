<!doctype html>
<!-- Shapr's gallery preview (shapr/preview.png). bin/preview fills each placeholder from manifest.json
     and screenshots the page at 1600 x 1000. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shapr preview</title>
<style>
  @font-face { font-family: "Roboto Flex"; src: url("fonts/RobotoFlex-Variable.ttf") format("truetype"); font-weight: 100 1000; font-stretch: 25% 151%; }
  :root { --ground: #0e0f11; --ink: #f3efe8; --muted: #a9a49c; --amber: #f2b45c; --seed: {{seed}}; --accent: {{accent}}; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 1000px; overflow: hidden; background: var(--ground); }
  body { position: relative; font-family: "Roboto Flex", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .glow { position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(700px 480px at 1030px 600px, color-mix(in srgb, var(--seed) 55%, transparent), transparent 70%),
      radial-gradient(560px 380px at 1200px 200px, color-mix(in srgb, var(--seed) 30%, transparent), transparent 70%),
      radial-gradient(520px 480px at 300px 300px, color-mix(in srgb, var(--seed) 30%, transparent), transparent 70%),
      radial-gradient(420px 380px at 230px 780px, color-mix(in srgb, #984061 22%, transparent), transparent 70%); }
  .copy { position: absolute; left: 96px; top: 76px; width: 516px; } /* the left column: the theme dialog to the end of its caption */
  /* The cut-out sheep as a sticker: a cream rim (stacked hard shadows) so its black lines read on the dark ground.
     The wordmark below it is the logo's own, recoloured cream, with no rim. */
  .brand { display: flex; flex-direction: column; align-items: center; width: 352px; margin: 0 auto; }
  .sheep { height: 337px; width: auto; display: block;
    filter: drop-shadow(3px 0 0 #fdf8f5) drop-shadow(-3px 0 0 #fdf8f5) drop-shadow(0 3px 0 #fdf8f5) drop-shadow(0 -3px 0 #fdf8f5)
            drop-shadow(2px 2px 0 #fdf8f5) drop-shadow(-2px -2px 0 #fdf8f5)
            drop-shadow(0 18px 40px rgb(0 0 0 / .45)) drop-shadow(0 0 70px color-mix(in srgb, var(--seed) 55%, transparent)); }
  .word { height: 120px; width: auto; display: block; margin-top: 14px;
    filter: drop-shadow(0 0 40px color-mix(in srgb, var(--seed) 45%, transparent)); }
  h1 { margin-top: 36px; font-size: 45px; line-height: 1.1; font-weight: 720; font-stretch: 84%; letter-spacing: -.025em; white-space: nowrap; font-variation-settings: "opsz" 144; }
  h1 em { font-style: normal; color: var(--accent); }
  .shot { position: absolute; display: block; }
  .shot img { display: block; width: 100%; height: auto; }
  .light { left: 830px; top: 76px; width: 720px; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px rgb(255 255 255 / .08), 0 24px 60px rgb(0 0 0 / .55); }
  .main { left: 640px; top: 318px; width: 860px; border-radius: 16px; overflow: hidden;
    box-shadow: 0 0 0 1px rgb(255 255 255 / .09), 0 30px 80px rgb(0 0 0 / .6), 0 0 140px color-mix(in srgb, var(--seed) 50%, transparent); }
  .theme { left: 96px; top: 604px; width: 262px; border-radius: 14px; overflow: hidden;
    box-shadow: 0 0 0 1px rgb(255 255 255 / .10), 0 24px 60px rgb(0 0 0 / .6), 0 0 90px color-mix(in srgb, #984061 40%, transparent); }
  .caption { position: absolute; display: flex; gap: 12px; font-size: 21px; font-weight: 600; letter-spacing: -.005em; line-height: 1.3; }
  .caption::before { content: ""; width: 18px; height: 3px; margin-top: 13px; border-radius: 2px; background: var(--amber); flex: none; }
  .c-light { left: 830px; top: 32px; }
  .c-main { left: 656px; top: 890px; }
  .c-theme { left: 380px; top: 614px; flex-direction: column; gap: 0; white-space: nowrap; }
  .c-theme::before { display: none; }
  .c-theme .label { display: flex; gap: 12px; }
  .c-theme .label::before { content: ""; width: 18px; height: 3px; margin-top: 13px; border-radius: 2px; background: var(--amber); flex: none; }
  .swatches { display: flex; gap: 8px; margin: 12px 0 0 30px; }
  .swatches i { width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 0 0 2px rgb(255 255 255 / .12); }
  /* The headline, one word per line (a word gap as wide as the box), left-aligned with the theme caption's text. */
  .stack { position: absolute; left: 410px; top: 690px; width: 230px; word-spacing: 230px; white-space: normal; margin: 0; font-size: 46px; line-height: 1.02; font-weight: 720;
    font-stretch: 84%; letter-spacing: -.025em; font-variation-settings: "opsz" 144; }
  .stack em { font-style: normal; color: var(--accent); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="copy">
    <div class="brand" role="img" aria-label="Shapr logo: a cloud sheep with a purple horn above the word Shapr">
      <img class="sheep" src="logo-sheep.png" alt=""><img class="word" src="logo-word.png" alt="">
    </div>
  </div>
  <figure class="shot light"><img src="{{shot.light}}" alt="{{shot.light.alt}}"></figure>
  <figure class="shot main"><img src="{{shot.main}}" alt="{{shot.main.alt}}"></figure>
  <figure class="shot theme"><img src="{{shot.theme}}" alt="{{shot.theme.alt}}"></figure>
  <p class="caption c-light">{{copy.captions.light}}</p>
  <p class="caption c-main">{{copy.captions.main}}</p>
  <p class="caption c-theme"><span class="label">{{copy.captions.theme}}</span><span class="swatches"><i style="background:#6750A4"></i><i style="background:#984061"></i></span></p>
  <h1 class="stack">{{copy.headline}} <em>{{copy.accent}}</em></h1>
</body>
</html>
